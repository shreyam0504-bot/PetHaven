<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile | Pet Haven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-profile">
  <!-- HEADER -->
  <header class="site-header">
    <div class="logo-area">
      <span class="logo-paw">🐾</span>
      <span class="logo-text">Pet Haven</span>
    </div>

    <nav class="nav-links">
      <a href="home.html">Home</a>
      <a href="pets.html">Available Pets</a>
      <a href="give-pet.html">Give a Pet for Adoption</a>
      <a href="care-tips.html">Pet Care Tips</a>
      <a href="match-quiz.html">Match Quiz</a>
      <a href="user-profile.html" class="active">My Profile</a>
      <a href="user-requests.html">My Requests</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="compare.html">Compare</a>
    </nav>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>

    <button class="nav-toggle" aria-label="Toggle navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main>
    <section class="section">
      <div class="section-header">
        <h1>My profile</h1>
        <p>Save your details so the shelter team can contact you faster.</p>
      </div>

      <div class="profile-card">
        <form id="profileForm">
          <div class="form-group">
            <label for="profileName">Full name</label>
            <input type="text" id="profileName" required />
          </div>

          <div class="form-group">
            <label for="profileEmail">Email</label>
            <input type="email" id="profileEmail" required />
          </div>

          <div class="form-group">
            <label for="profilePhone">Phone (optional)</label>
            <input type="tel" id="profilePhone" />
          </div>

          <div class="form-group">
            <label for="profilePref">Preferred pet type</label>
            <select id="profilePref">
              <option value="">No preference</option>
              <option value="Dog">Dogs</option>
              <option value="Cat">Cats</option>
              <option value="Rabbit">Rabbits</option>
              <option value="Bird">Birds</option>
              <option value="Other">Others</option>
            </select>
          </div>

          <button type="submit" class="btn primary">Save profile</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 Pet Haven · Made with 🐾 for animals</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
