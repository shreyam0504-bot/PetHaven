<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login | Pet Haven</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body class="page-admin-login">
  <header class="site-header">
    <div class="logo-area">
      <span class="logo-paw">🐾</span>
      <span class="logo-text">Pet Haven Admin</span>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-header">
        <h1>Admin login</h1>
        <p>Only shelter staff can access adoption requests.</p>
      </div>

      <div class="profile-card">
        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminEmail">Email</label>
            <input type="email" id="adminEmail" placeholder="admin@pethaven.com" required />
          </div>

          <div class="form-group">
            <label for="adminPassword">Password</label>
            <input type="password" id="adminPassword" required />
          </div>

          <button type="submit" class="btn primary full-width">Login</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2025 Pet Haven · Admin Panel</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
